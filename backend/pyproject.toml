[project]
name = "smartdesk-backend"
version = "0.1.0"
description = "SmartDesk AI — Django REST backend with ML-powered ticket triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.10",
    "factory-boy>=3.3",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
